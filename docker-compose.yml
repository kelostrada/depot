services:
  db:
    # Matches the source server (seohost runs MariaDB 10.11) so the production
    # dump imports 1:1. Small buffer pool — tiny DB.
    image: mariadb:10.11
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=64M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-depot}
      MARIADB_USER: ${DB_USERNAME:-depot}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - depot_db:/var/lib/mysql
      # Drop the production dump here before first start; imported only on a
      # fresh volume.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/kelostrada/depot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-4004}:80"
    volumes:
      # Laravel reads its config from .env — one real file on the host
      # (secrets: APP_KEY, DB creds; DB_HOST must be "db").
      - ./app.env:/var/www/html/.env:ro
      - depot_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: ghcr.io/kelostrada/depot:${VERSION:-latest}
    restart: unless-stopped
    command: ["cron", "-f"]
    volumes:
      - ./app.env:/var/www/html/.env:ro
      - depot_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  depot_db:
    name: depot_db
  depot_storage:
    name: depot_storage
