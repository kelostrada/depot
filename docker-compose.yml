services:
  web:
    image: ghcr.io/kelostrada/depot:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-4004}:80"
    volumes:
      # Laravel reads its config from .env — one real file on the host
      # (secrets: APP_KEY, DB creds; DB_HOST is "mariadb", see networks below).
      - ./app.env:/var/www/html/.env:ro
      - depot_storage:/var/www/html/storage
      # Host-side files tracked in melinakrzemowa/air-infra (services/depot.kelostrada.pl):
      # big-cookie tolerance (browsers carrying kelostrada.pl cookie bloat), and
      # trusting the tunnel proxy so X-Forwarded-Proto yields https URLs.
      - ./apache-limits.conf:/etc/apache2/conf-enabled/zz-limits.conf:ro
      - ./TrustProxies.php:/var/www/html/app/Http/Middleware/TrustProxies.php:ro
    networks:
      - default
      - mariadb

  cron:
    image: ghcr.io/kelostrada/depot:${VERSION:-latest}
    restart: unless-stopped
    command: ["cron", "-f"]
    volumes:
      - ./app.env:/var/www/html/.env:ro
      - depot_storage:/var/www/html/storage
    networks:
      - default
      - mariadb

# The database is the Air's shared MariaDB server (melinakrzemowa/air-infra,
# services/mariadb): database `depot`, user `depot`, reached as host `mariadb`
# over this external network. The per-site db service that used to live here
# (mariadb:10.11, volume depot_db) was retired on 2026-09-30; air-infra keeps
# the rollback notes.
networks:
  mariadb:
    external: true

volumes:
  depot_storage:
    name: depot_storage
