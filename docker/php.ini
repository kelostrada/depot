; Production PHP settings for the depot image, installed as
; $PHP_INI_DIR/conf.d/zz-depot.ini (loaded after the stock extension inis).
; Everything not set here keeps PHP's built-in defaults, as before.

; Never show errors to visitors; log them (Apache error log -> docker logs,
; stderr for artisan/cron).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Laravel 6 and the packages locked with it predate PHP 8.1 and raise many
; E_DEPRECATED notices on PHP 8.3; they are not errors (see
; app/Bootstrap/HandleExceptions.php for the Laravel side).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

; Don't advertise the PHP version in an X-Powered-By header.
expose_php = Off
